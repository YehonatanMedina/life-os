name: tts

on:
  push:
    paths:
      - 'docs/news/latest.json'
  schedule:
    - cron: '50 3 * * *'   # רשת ביטחון אחרי סוכן הבוקר (שרץ ב-03:00 UTC)
  workflow_dispatch: {}

concurrency:
  group: tts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  narrate:
    # הדחיפה של הקריינות עצמה נוגעת ב-latest.json (החתימה) — בלי התנאי הזה
    # הריצה מעירה את עצמה שוב ושוב.
    if: github.event_name != 'push' || github.event.head_commit.author.email != 'tts@life-os.local'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # היסטוריה מלאה — בלעדיה כל קובץ נראה כאילו שונה ב-HEAD ובדיקת הטריות משתבשת
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # מי מחליט אם צריך להקליט: הסקריפט, לפי חתימת הטקסט (docs/news/audio.json).
      # זמני commit לא מספרים את האמת — גיליון חדש יכול לשבת ליד קריינות ישנה.
      - name: Generate narration
        run: node scripts/make-audio.mjs
        env:
          TTS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          ELEVEN_MODEL: ${{ secrets.ELEVEN_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # פנקס הסיפורים: מה כבר סופר, כדי שהעורך לא יחזור על סיפור שכבר סיפר.
      # הוא נבנה מהארכיון אחרי כל גיליון, ונוסע לעורך בתוך קובץ המשוב.
      - name: Covered ledger
        run: node scripts/news-ledger.mjs build
      - name: Repeat check
        continue-on-error: true
        run: node scripts/news-ledger.mjs check
      # המחסן, לא רק המאגר: כך העורך רואה את הפנקס גם אם הטלפון לא נפתח מאז אתמול
      - name: Covered ledger to store
        continue-on-error: true
        run: node scripts/covered-to-gist.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
      - name: Commit
        run: |
          git config user.name "life-os-tts"
          git config user.email "tts@life-os.local"
          git add docs/news/latest.mp3 docs/news/audio.json docs/news/latest.json docs/news/archive docs/news/covered.json
          git diff --cached --quiet || git commit -m "קריינות הבוקר"
          git pull --rebase origin main
          git push origin main
