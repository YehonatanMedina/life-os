ליים 6–10, ליבה 6–9, מניעה 4–6. אחיזה נספרת כחזרה לכל שתי שניות."],progress:["נפח שבועי עולה כ-10%, עם שבוע ירידה של 30% כל רביעי. זה מה שתוכניות אמיתיות עושות, לא כלל בטיחות — pubmed.ncbi.nlm.nih.gov/38695978/","הסף שנמדד באמת הוא עלייה של מעל 30% בנפח על פני שבועיים, על 874 רצים — jospt.org/doi/10.2519/jospt.2014.5164","אימון בודד לא חורג מ-110% מהארוך ביותר ב-30 הימים האחרונים — pmc.ncbi.nlm.nih.gov/articles/PMC12421110/","בשלושת השבועות הראשונים של בנייה חדשה מעלים חצי מהקצב — זה החלון שנמדד כפגיע — pubmed.ncbi.nlm.nih.gov/30526231/","לא מעלים נפח ועצימות באותו שבוע. שבוע נפח, שבוע איכות.","קצבים משתנים רק כשמבחן שדה השתנה מעבר לשגיאת המדידה: 4.2% במבחן 5 ק״מ.","משקל בתרגיל עולה בהתקדמות כפולה: קודם סוגרים את ראש טווח החזרות בכל הסטים, ואז מעלים וחוזרים לתחתית הטווח.","אחיזה סטטית: 60–75% מהמקסימום, 36–48 שניות תחת מתח לתרגיל, והמדרגה היא התנוחה ולא השעון.","כוח קונה כלכלת ריצה ולא VO2max — בכל המטא-אנליזות. עומס ≥80% נדרש, והאפקט מגיע מ-10 שבועות והלאה — pmc.ncbi.nlm.nih.gov/articles/PMC11258194/","פחות מ-24 אימוני כוח (12 שבועות בתדירות הזו) — האפקט על עלות האנרגיה לא מובהק (SMD 0.10). מעל 24 — 0.63. אסור לשפוט את הבלוק לפני כן.","פליומטריקה לבדה כמעט לא עושה כלום (ES 0.19); יחד עם כוח כבד — 1.34. היא תוספת, לא תחליף.","אימון כוח מוריד פציעות יתר לכ-53% (RR 0.527, I²=0), ומתיחות לא עושות כלום (RR 0.963) — bjsm.bmj.com/content/48/11/871"],adapt:["מה שמניע החלטה הוא מה שנרשם: סטים, קצב, והערה חופשית. אין ציון מוכנוּת, כי אין מסך שאוסף אותו — ומדד שאי אפשר להזין הוא הבטחה ריקה.","לא פועלים על נקודה בודדת: שתי דרישות, או יומיים ברצף. שגיאת הדיווח של RIR היא ±1.45 חזרות.","א-סימטריה: מהירים להוריד, איטיים להעלות. הורדה שגויה עולה אימון אחד; העלאה שגויה עולה חודש.","לעולם לא מוסיפים עומס בגלל אות טוב. מותר להוריד, לשמור, או לחזור לתוכנית.","תקיעוּת היא שלושה אימונים בלי עלייה ברמה — לא אימון חלש אחד.","שינוי של פחות מ-5% במשקל המוערך הוא רעש. פועלים על 5% ומעלה, או על שלושה אימונים באותו כיוון.","לא מסיקים מסקנה מתרגיל רגליים ב-24 השעות שאחרי ריצה קשה — המספר ייקרא ## מה אתה רואה
בהודעת המערכת מצורפים: הזיכרון שלך (מה שלמדת עליו בשיחות קודמות), והקשר מהאפליקציה: הגדרות ויעדים, מסלולים, משימות פתוחות, היומן לימים הקרובים, בלוקים קבועים, הרגלים ומה בוצע היום, מטרות השבוע, האימון, ומה קורה ברגע זה (טיימר, דקות היום). ההקשר הוא האמת — אל תמציא דברים שאינם בו. אם משהו חסר לך, שאל.

## מה לא שלך — להעביר לאטלס העמוק
יש לך אח בענן עם גישה לקוד של האפליקציה ולזמן חשיבה ארוך. תעביר אליו (escalate) רק כשבאמת צריך: שינוי בקוד או במסך של האפליקציה ("תוסיף אפשרות…", "תשנה את המסך…"), תכנון של תקופה שלמה שדורש לשקלל שבועות של נתונים, או ניתוח מעמיק. הכל אחר — עדכונים, שאלות, התייעצות, תזוזות ביומן, אימונים — שלך, עכשיו. כשאתה מעביר: משפט אחד שאומר מה מעביר ולמה, בלי לנסות לענות בעצמך.

## זיכרון
אם למדת משהו שצריך להחזיק גם בשיחה הבאה (החלטה, התחייבות שלו, העדפה, דפוס) — שורה אחת ב-memory. לא כל הודעה מצדיקה זיכרון.
