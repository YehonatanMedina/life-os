ת");for(let c=0;c<7;c++)a(c,"legs")&&(a(c+1,"quality-run")||a(c+1,"long-run"))&&s.push(`יום ${c+1}: רגליים כבדות, ולמחרת ריצה קשה — כלכלת הריצה יורדת ב-24 השעות האלה`),a(c,"long-run")&&e[c].length>1&&s.push(`יום ${c+1}: הריצה הארוכה חולקת יום עם אימון נוסף`),a(c,"quality-run")&&(a(c+1,"quality-run")||a(c+1,"long-run"))&&s.push(`יום ${c+1}: שני ימי ריצה קשים ברצף`),a(c,"skills")&&a(c+1,"skills")&&s.push(`יום ${c+1}: שני ימי סטטיים ברצף — הגיד מסתגל לאט מהשריר, וצריך 48 שעות`);const u=e.filter(c=>c.some(h=>h.endsWith("run"))).length;return u<S0.runDays&&s.push(`${u} ימי ריצה בשבוע — מתחת לשלוש אין ארוכה, איכות וקלה`),s}const B5={about:"החוקים שלפיהם התוכנית נבנית ומשתנה. כל מספר מגיע ממקור שכתוב לידו.",week:["שלוש ריצות בשבוע — ארוכה, איכות וקלה — וזו תקרה שנקבעה (22.9.2026), לא יעד. מה שמעבר לה הולך לכוח.","**אין תקרת זמן על ריצה.** תקרת 45 הדקות חלה על אימוני כוח בלבד. שלוש ריצות בלי תקרה נושאות יותר נפח מחמש ריצות חסומות, וזה גם המבנה של FIRST (שלוש ריצות + אימוני כוח, RE +2%, VO2max +4.8%) — furman.edu/first/","בשלוש ריצות יש אימון איכות אחד: ארוכה + איכות + קלה. שתי איכויות דורשות ארבע ריצות ומעלה, כי בלי ריצה קלה אחת לפחות חלוקת העצימות מתמוטטת.","עד שלושה ימים קשים: איכות, רגליים, ארוכה.","אין ריצה קשה ב-24 השעות שאחרי רגליים כבדות — כלכלת ריצה יורדת 5.6–10% — pubmed.ncbi.nlm.nih.gov/23724883/","כוח פלג גוף עליון וריצה יכולים לחלוק יום — ההפרעה מקומית לשריר — pubmed.ncbi.nlm.nih.gov/39921365/","הריצה הארוכה לבד ביום שלה, ולפחות 70 דקות — מתחת לזה היא לא קונה עמידוּת — pubmed.ncbi.nlm.nih.gov/40878015/","הריצה הארוכה אף פעם לא קצרה מהארוכה ביותר ב-30 הימים האחרונים, ואף פעם לא מעל 110% ממנה. אחוז מהשבוע קובע אותה רק כשהוא **גבוה** מהרצפה הזו — אחרת שבוע קטן עם ארוכה אחת גדולה היה מייצר נסיגה באימון היחיד שקונה עמידוּת. כשהרצפה גוררת אותה למעלה, הנפח השבועי גדל איתה והתוספת הולכת לריצות הקלות — pmc.ncbi.nlm.nih.gov/articles/PMC12421110/","ימי ריצה רצופים, כשיש כאלה, הם תמיד קל אחרי קשה או קל לפני ארוך. האיסור הוא על שני ימים **קשים** ברצף, לא על שתי ריצות.","ארבעה ימי כוח, ומתוכם **יום רגליים אחד בלבד**. שלושה ימי כוח בשבוע פגעו בסף האירובי (SMD −0.45) — אבל ההפרעה מקומית לשריר, ושלושת הימים האחרים הם פלג גוף עליון שהריצה לא נוגעת בו — journals.humankinetics.com/view/journals/ijspp/13/1/article-p57.xml · pubmed.ncbi.nlm.nih.gov/39921365/","75–85% מדקות הריצה קלות. חלוקה פירמידלית, לא פולריזציה דוגמטית — בחובבים אין הבדל — pubmed.ncbi.nlm.nih.gov/39888556/","שני ימי משיכה לא ברצף: 48 שעות ביניהם, כי הגיד מסתגל לאט מהשריר — pmc.ncbi.nlm.nih.gov/articles/PMC4532714/","היום שאחרי הריצה הארוכה הוא פלג גוף עליון, ריצה קלה או מנוחה — אובדן כוח אחרי ריצה שמייצרת נזק נמשך 24–48 שעות.","עומס עקבים כבד דורש 48 שעות מריצה קשה: גיד אכילס סופג 5–8 פעמים משקל גוף בכל צעד, וזו הדרך הסבירה ביותר לפציעת יתר בתוכנית הזו.","כל ההפרעה בין כוח לריצה יושבת באימון משותף: אותו אימון SMD −0.66, בהפרדה של שעתיים ומעלה −0.10 — pmc.ncbi.nlm.nih.gov/articles/PMC8053170/","מה שנפגע באמת הוא כוח מתפרץ (SMD −0.28), לא כוח מרבי ולא היפרטרופיה — ולכן הפליומטריקה נשמרת ולא נחתכת ראשונה — pmc.ncbi.nlm.nih.gov/articles/PMC8891239/",'עצימות הריצה אינה המתווך; הנפח הוא. אינטרוולים לא "עולים" יותר לכוח מריצה רגילה באותו נפח — frontiersin.org/articles/10.3389/fphys.2016.00487/full'],skills:["תרגול מיומנות נעשה טרי או שלא נעשה: תרגול תחת עייפות הגיע ל-68% מהביצוע, והפער נשאר כמעט שני אימונים נוספים — elifesciences.org/articles/40578","ולכן עמידת ידיים היא בלוק ביתי של 10 דקות לפני כל יום, ולא תרגיל בחדר הכושר. תדירות 5–7 בשבוע, לא נפח.","סדר בתוך האימון: חימום · מיומנות · סטטי ואחיזה · כוח בזרוע כפופה · עזר וליבה.","עומס מתחת ל-70% מהמקסימום לא משפר את הגיד בכלל (SMD 0.04 מול 0.90) — אבל כן צובר עליו שחיקה. אחיזות קלות לאורך היום הן עלות בלי תשואה — pmc.ncbi.nlm.nih.gov/articles/PMC4532714/","תקציב הגיד: עד 120 שניות אחיזה בזרוע ישרה באימון, עד 300 בשבוע, גידול של עד 20% משבוע לשבוע.",'העצב מסתגל בשבועות, השריר ב-6–8, הגיד ב-8–12 — ולכן אסור לקרוא לשלב "תקוע" לפני שמונה שבועות חשיפה.',"זוגות אנטגוניסטיים (מתח מול מקבילים) — אותה תוצאה בכ-30–50% פחות זמן — pubmed.ncbi.nlm.nih.gov/20733520/","סטים שבועיים: משיכה 12–16, דחיפה 10–14, רגליים 6–10, ליבה 6–9, מניעה 4–6. אחיזה נספרת כחזרה לכל שתי שניות."],progress:["נפח שבועי עולה כ-10%, עם שבוע ירידה של 30% כל רביעי. זה מה שתוכניות אמיתיות עושות, לא כלל בטיחות — pubmed.ncbi.nlm.nih.gov/38695978/","הסף שנמדד באמת הוא עלייה של מעל 30% בנפח על פני שבועיים, על 874 רצים — jospt.org/doi/10.2519/jospt.2014.5164","אימון בודד לא חורג מ-110% מהארוך ביותר ב-30 הימים האחרונים — pmc.ncbi.nlm.nih.gov/articles/PMC12421110/","בשלושת השבועות הראשונים של בנייה חדשה מעלים חצי מהקצב — זה החלון שנמדד כפגיע — pubmed.ncbi.nlm.nih.gov/30526231/","לא מעלים נפח ועצימות באותו שבוע. שבוע נפח, שבוע איכות.","קצבים משתנים רק כשמבחן שדה השתנה מעבר לשגיאת המדידה: 4.2% במבחן 5 ק״מ.","משקל בתרגיל עולה בהתקדמות כפולה: קודם סוגרים את ראש טווח החזרות בכל הסטים, ואז מעלים וחוזרים לתחתית הטווח.","אחיזה סטטית: 60–75% מהמקסימום, 36–48 שניות תחת מתח לתרגיל, והמדרגה היא התנוחה ולא השעון.","כוח קונה כלכלת ריצה ולא VO2max — בכל המטא-אנליזות. עומס ≥80% נדרש, והאפקט מגיע מ-10 שבועות והלאה — pmc.ncbi.nlm.nih.gov/articles/PMC11258194/","פחות מ-24 אימוני כוח (12 שבועות בתדירות הזו) — האפקט על עלות האנרגיה לא מובהק (SMD 0.10). מעל 24 — 0.63. אסור לשפוט את הבלוק לפני כן.","פליומטריקה לבדה כמעט לא עושה כלום (ES 0.19); יחד עם כוח כבד — 1.34. היא תוספת, לא תחליף.","אימון כוח מוריד פציעות יתר לכ-53% (RR 0.527, I²=0), ומתיחות לא עושות כלום (RR 0.963) — bjsm.bmj.com/content/48/11/871"],adapt:["מה שמניע החלטה הוא מה שנרשם: סטים, קצב, והערה חופשית. אין ציון מוכנוּת, כי אין מסך שאוסף אותו — ומדד שאי אפשר להזין הוא הבטחה ריקה.","לא פועלים על נקודה בודדת: שתי דרישות, או יומיים ברצף. שגיאת הדיווח של RIR היא ±1.45 חזרות.","א-סימטריה: מהירים להוריד, איטיים להעלות. הורדה שגויה עולה אימון אחד; העלאה שגויה עולה חודש.","לעולם לא מוסיפים עומס בגלל אות טוב. מותר להוריד, לשמור, או לחזור לתוכנית.","תקיעוּת היא שלושה אימונים בלי עלייה ברמה — לא אימון חלש אחד.","שינוי של פחות מ-5% במשקל המוערך הוא רעש. פועלים על 5% ומעלה, או על שלושה אימונים באותו כיוון.","לא מסיקים מסקנה מתרגיל רגליים ב-24 השעות שאחרי ריצה קשה — המספר ייקרא נמוך, והמערכת תוריד עומס בלי סיבה.","סדר השינוי כשתקוע: קודם שבוע ירידה, אחר כך נפח, אחר כך טווח חזרות, אחר כך תדירות, ורק בסוף החלפת תרגיל.","שינוי מבני אחד לתרגיל בשלושה שבועות, ולכל היותר שניים בכל התוכנית בשבוע — מערכת שמשנה שני דברים ביחד לא יכולה לדעת מה עבד.","אימון שלא התקיים נמחק, לא נדחף קדימה, ובשום מצב לא מושלם על ידי הארכת ריצה אחרת.","רצפת השבוע: ריצה ארוכה אחת, אימון איכות אחד, שני אימוני כוח, ארבעה ימי ריצה.","שבוע ירידה כל 4–6 שבועות: חצי מהסטים, אותו משקל, ואותה תדירות. בריצה — 30% פחות נפח ואימון איכות אחד מקוצר בעצימות מלאה."],forbidden:["ACWR — c-statistic 0.574 מול 0.5 של מודל ריק, ומשחזר את עצמו עם מכנה אקראי — pubmed.ncbi.nlm.nih.gov/33332011/","כלל ה-10% כאמצעי בטיחות — הניסוי היחיד: 20.8% מול 20.3%, p=0.90 — pubmed.ncbi.nlm.nih.gov/17940147/",'סף של "ירידה של X% בזמן האחיזה" — מהימנות המדידה ICC 0.64, הסף היה נורה על רעש.',"מדד מונוטוניות כאזהרה — בקבוצת הרצים היחידה שנבדקה הוא לא ניבא כלום (p>0.05).","הצגת ציון מוכנוּת לפני האימון — הוא יוצר את מה שהוא מנבא.","הבטחה ש-VO2max יעלה מאימוני כוח — אף מטא-אנליזה לא מצאה את זה."],gymConstraints:["השבוע נגזר משלושה נתונים שנשמרים ולא מהנחה בקוד: כמה ריצות (settings.runsPerWeek), באילו ימים יש חדר כושר (settings.gymDays), ומה הנפח שבאמת נרוץ.","בלי סקוואט, דדליפט ומכרעים בחדר כושר. **גם Split Squat ובולגרי נחשבים מכרע** ואסורים שם — נקבע 22.9.2026. התחליף שנמדד: לחיצת רגליים והרמות עקבים — עלות החמצן ירדה 2.0% — pubmed.ncbi.nlm.nih.gov/39523854/","גשר ירך במוט (Hip Thrust) — מותר בחדר כושר, ונקבע 22.9.2026. הוא דפוס ה-Hinge היחיד בתוכנית: הכוח הגבוה ביותר על יישור הירך בלי שום עומס על עמוד השדרה.","מכרעים במשקל גוף בבית — מותרים, אבל בלי משקל הם תחזוקה ולא בנייה: העומס שמשפר כלכלת ריצה הוא ≥80% ממקסימום, ועומס של 40–79% לא משפר אותה כלל.","דדליפט רומני — לא בחדר כושר. בבית זה בסדר.","תרגיל שנראה חריג בחדר כושר עובר לבלוק הביתי של עשר הדקות לפני האימון — וזה גם מה שהמחקר רוצה בשביל עמידת ידיים.","אין חדר כושר בשישי ובשבת. יום סגור ## מה לא שלך — להעביר לאטלס העמוק
יש לך אח בענן עם גישה לקוד של האפליקציה ולזמן חשיבה ארוך. תעביר אליו (escalate) רק כשבאמת צריך: שינוי בקוד או במסך של האפליקציה ("תוסיף אפשרות…", "תשנה את המסך…"), תכנון של תקופה שלמה שדורש לשקלל שבועות של נתונים, או ניתוח מעמיק. הכל אחר — עדכונים, שאלות, התייעצות, תזוזות ביומן, אימונים — שלך, עכשיו. כשאתה מעביר: משפט אחד שאומר מה מעביר ולמה, בלי לנסות לענות בעצמך.

## זיכרון
אם למדת משהו שצריך להחזיק גם בשיחה הבאה (החלטה, התחייבות שלו, העדפה, דפוס) — שורה אחת ב-memory. לא כל הודעה מצדיקה זיכרון.
