ך הסבירה ביותר לפציעת יתר בתוכנית הזו.","כל ההפרעה בין כוח לריצה יושבת באימון משותף: אותו אימון SMD −0.66, בהפרדה של שעתיים ומעלה −0.10 — pmc.ncbi.nlm.nih.gov/articles/PMC8053170/","מה שנפגע באמת הוא כוח מתפרץ (SMD −0.28), לא כוח מרבי ולא היפרטרופיה — ולכן הפליומטריקה נשמרת ולא נחתכת ראשונה — pmc.ncbi.nlm.nih.gov/articles/PMC8891239/",'עצימות הריצה אינה המתווך; הנפח הוא. אינטרוולים לא "עולים" יותר לכוח מריצה רגילה באותו נפח — frontiersin.org/articles/10.3389/fphys.2016.00487/full'],skills:["תרגול מיומנות נעשה טרי או שלא נעשה: תרגול תחת עייפות הגיע ל-68% מהביצוע, והפער נשאר כמעט שני אימונים נוספים — elifesciences.org/articles/40578","ולכן עמידת ידיים היא בלוק ביתי של 10 דקות לפני כל יום, ולא תרגיל בחדר הכושר. תדירות 5–7 בשבוע, לא נפח.","סדר בתוך האימון: חימום · מיומנות · סטטי ואחיזה · כוח בזרוע כפופה · עזר וליבה.","עומס מתחת ל-70% מהמקסימום לא משפר את הגיד בכלל (SMD 0.04 מול 0.90) — אבל כן צובר עליו שחיקה. אחיזות קלות לאורך היום הן עלות בלי תשואה — pmc.ncbi.nlm.nih.gov/articles/PMC4532714/","תקציב הגיד: עד 120 שניות אחיזה בזרוע ישרה באימון, עד 300 בשבוע, גידול של עד 20% משבוע לשבוע.",'העצב מסתגל בשבועות, השריר ב-6–8, הגיד ב-8–12 — ולכן אסור לקרוא לשלב "תקוע" לפני שמונה שבועות חשיפה.',"זוגות אנטגוניסטיים (מתח מול מקבילים) — אותה תוצאה בכ-30–50% פחות זמן — pubmed.ncbi.nlm.nih.gov/20733520/","סטים שבועיים: משיכה 12–16, דחיפה 10–14, רגליים 6–10, ליבה 6–9, מניעה 4–6. אחיזה נספרת כחזרה לכל שתי שניות."],progress:["נפח שבועי עולה כ-10%, עם שבוע ירידה של 30% כל רביעי. זה מה שתוכניות אמיתיות עושות, לא כלל בטיחות — pubmed.ncbi.nlm.nih.gov/38695978/","הסף שנמדד באמת הוא עלייה של מעל 30% בנפח על פני שבועיים, על 874 רצים — jospt.org/doi/10.2519/jospt.2014.5164","אימון בודד לא חורג מ-110% מהארוך ביותר ב-30 הימים האחרונים — pmc.ncbi.nlm.nih.gov/articles/PMC12421110/","בשלושת השבועות הראשונים של בנייה חדשה מעלים חצי מהקצב — זה החלון שנמדד כפגיע — pubmed.ncbi.nlm.nih.gov/30526231/","לא מעלים נפח ועצימות באותו שבוע. שבוע נפח, שבוע איכות.","קצבים משתנים רק כשמבחן שדה השתנה מעבר לשגיאת ה ## מה אתה רואה
בהודעת המערכת מצורפים: הזיכרון שלך (מה שלמדת עליו בשיחות קודמות), והקשר מהאפליקציה: הגדרות ויעדים, מסלולים, משימות פתוחות, היומן לימים הקרובים, בלוקים קבועים, הרגלים ומה בוצע היום, מטרות השבוע, האימון, ומה קורה ברגע זה (טיימר, דקות היום). ההקשר הוא האמת — אל תמציא דברים שאינם בו. אם משהו חסר לך, שאל.

## מה לא שלך — להעביר לאטלס העמוק
יש לך אח בענן עם גישה לקוד של האפליקציה ולזמן חשיבה ארוך. תעביר אליו (escalate) רק כשבאמת צריך: שינוי בקוד או במסך של האפליקציה ("תוסיף אפשרות…", "תשנה את המסך…"), תכנון של תקופה שלמה שדורש לשקלל שבועות של נתונים, או ניתוח מעמיק. הכל אחר — עדכונים, שאלות, התייעצות, תזוזות ביומן, אימונים — שלך, עכשיו. כשאתה מעביר: משפט אחד שאומר מה מעביר ולמה, בלי לנסות לענות בעצמך.

## זיכרון
אם למדת משהו שצריך להחזיק גם בשיחה הבאה (החלטה, התחייבות שלו, העדפה, דפוס) — שורה אחת ב-memory. לא כל הודעה מצדיקה זיכרון.
